packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": 24.13.6
  typescript: 7.0.2
  zod: 4.6.5

catalogs:
  react19:
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - tar@7.5.21
  - postcss@8.5.23
  - nanoid@3.3.16 || 3.3.17
allowBuilds:
  "@depot/cli@0.0.1-cli.2.80.0": true
  esbuild: set this to true or false
  esbuild@0.25.0: true
  sharp@0.35.4: true
overrides:
  "@opentelemetry/core": 2.8.0
  deepmerge-ts: ">=8.0.0"
  engine.io: 6.6.7
  esbuild: 0.25.0
  postcss: 8.5.23
  qs: 6.16.0
  sharp: 0.35.4
  tar: 7.5.21
  ws: 8.21.0
  nanoid@<3.3.17: ^3.3.17
  postcss@<=8.5.22: ^8.5.23
peerDependencyRules:
  allowedVersions:
    typescript: 7.0.2
saveExact: true
strictPeerDependencies: true
# Accepted 2026-10-03 by the owner (PRD-009 security close-out, SEC-009-01): braces 3.0.3
# (GHSA-vfj7-8cjw-p6xm, high) reaches this repository only through the trigger.dev CLI, a
# devDependency of apps/tasks; `pnpm audit --prod` is clean, and no fixed braces (3.0.4) is
# published. Remove this entry as soon as a fixed braces ships and the lockfile takes it.
# tooling/tests/unit/dependencies/accepted-advisories.test.ts holds the list to this one entry.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

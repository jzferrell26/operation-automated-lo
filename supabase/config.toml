# Phase 0 local-only Supabase configuration.
# This project is intentionally unlinked. Do not add a project ref, access token,
# database URL, or production secret to this file.
project_id = "operation-automated-lo-phase-0"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = true
port = 55429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55424
smtp_port = 55425
pop3_port = 55426

[analytics]
enabled = false

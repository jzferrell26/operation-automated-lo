name: Phase 0 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Application verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PRD-006d 006D-AC-013. `baseline-note.test.ts` diffs against `origin/${GITHUB_BASE_REF}`;
          # a depth-1 checkout never has that ref, so the guard would pass on every pull request.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the non-database verification gate
        run: pnpm verify:offline
        env:
          # PRD-006d 006D-AC-013. `baseline-note.test.ts` reads the pull request body here so that a
          # branch that moves a screen baseline without saying why fails the gate. It is empty on a
          # push to a branch with no pull request, which is the case the test treats as "nothing
          # branch-specific to check".
          PR_BODY: ${{ github.event.pull_request.body }}

  database:
    name: Real PostgreSQL migrations and pgTAP
    runs-on: ubuntu-24.04
    # PRD-006c D9 added the review browser run to `pnpm test:db`: a web build, a real `next start`
    # in review mode behind a TLS terminator, and the `review` Playwright specs. The timed spec
    # alone spends its budget on deliberate typing and reading pauses, and the accessibility
    # matrix walks the steps four times.
    #
    # Wave 7m measured the two halves on 2026-09-20: the review suite is 12 to 13 minutes on the
    # runner when nothing hangs, and the database half about 8, which is 21 with the build and the
    # install on top of it. One retry of the longest spec's 300-second budget adds 5 more. 45 left
    # nothing for a slow Docker host on top of that; 60 does.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_TELEMETRY_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # PRD-006c D9. The review browser run inside `pnpm test:db` drives a real browser, so this
      # job needs the same Chromium the verify job installs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the canonical real database verification
        run: pnpm test:db

      # Wave 7m. Playwright keeps a trace for every failed test (`playwright.config.ts`,
      # `trace: "retain-on-failure"`). Without this they die with the runner, which is why the
      # 2026-09-20 review flake had to be reproduced on a workstation before it could be read.
      - name: Hand back the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-failure-traces
          path: test-results/browser
          if-no-files-found: ignore
          retention-days: 7

  release-contract:
    name: Release and recovery contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release contract code
        run: pnpm --filter @oalo/config build

      - name: Create a synthetic preview candidate manifest
        shell: bash
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node tooling/scripts/release/create-release-manifest.mjs \
            --environment preview \
            --commit "$RELEASE_COMMIT" \
            --build-id "$RELEASE_BUILD_ID" \
            --generated-at "$generated_at" \
            --verification-reference "github:${{ github.repository }}:actions:${{ github.run_id }}:${{ github.run_attempt }}" \
            --web-version "$RELEASE_BUILD_ID" \
            --tasks-version "$RELEASE_BUILD_ID" \
            --database-migration-version phase0 \
            --contract-version phase0 \
            --renderer-version phase0 \
            --template-version phase0 \
            --write \
            --output "$RUNNER_TEMP/release-manifest.json"

      - name: Create validated migration compatibility evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const outputDirectory = process.env.RUNNER_TEMP;
          const releaseBuildId = process.env.RELEASE_BUILD_ID;
          if (!outputDirectory || !releaseBuildId) {
            throw new Error("Release migration evidence requires runner and build identity.");
          }

          const manifest = (runtime, phase, buildId) => ({
            schemaVersion: 1,
            fixtureOnly: true,
            runtime,
            phase,
            buildId,
            contractVersion: "phase0",
            readContractVersions: ["phase0"],
            writeContractVersions: ["phase0"],
            activeMigration: "phase0",
            supportedMigrations: ["phase0"],
          });

          const documents = [
            ["prior-web.json", manifest("web", "baseline", "phase0-prior-web")],
            ["prior-tasks.json", manifest("tasks", "baseline", "phase0-prior-tasks")],
            ["candidate-web.json", manifest("web", "expand", releaseBuildId)],
            ["candidate-tasks.json", manifest("tasks", "expand", releaseBuildId)],
          ];
          await Promise.all(
            documents.map(([name, document]) =>
              writeFile(join(outputDirectory, name), `${JSON.stringify(document)}\n`, "utf8"),
            ),
          );
          NODE
          node tooling/scripts/release/validate-migration-compatibility.mjs \
            --prior-web-manifest "$RUNNER_TEMP/prior-web.json" \
            --prior-tasks-manifest "$RUNNER_TEMP/prior-tasks.json" \
            --candidate-web-manifest "$RUNNER_TEMP/candidate-web.json" \
            --candidate-tasks-manifest "$RUNNER_TEMP/candidate-tasks.json" \
            > "$RUNNER_TEMP/migration-compatibility.json"

      - name: Validate manifest compatibility
        run: |
          node tooling/scripts/release/validate-release-manifest.mjs \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --expected-environment preview \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-build-id "$RELEASE_BUILD_ID" \
            --migration-compatibility "$RUNNER_TEMP/migration-compatibility.json"

      - name: Confirm candidate cannot satisfy production evidence
        shell: bash
        run: |
          if node tooling/scripts/release/validate-release-manifest.mjs \
            --manifest "$RUNNER_TEMP/release-manifest.json" \
            --expected-environment preview \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-build-id "$RELEASE_BUILD_ID" \
            --migration-compatibility "$RUNNER_TEMP/migration-compatibility.json" \
            --require-production-evidence; then
            echo "Candidate manifest unexpectedly passed the production evidence gate"
            exit 1
          fi

      - name: Validate environment isolation contract
        run: node tooling/scripts/release/validate-environment-isolation.mjs --input tooling/scripts/release/fixtures/environment-isolation.synthetic.json

      - name: Validate recovery runbook inventory
        run: node tooling/scripts/release/validate-runbook-inventory.mjs

      - name: Confirm operation evidence stays dry-run
        run: node tooling/scripts/release/create-operation-evidence.mjs --operation deployment --environment preview --correlation-id corr_ci_dry_run_001

  preview-smoke:
    name: Preview smoke contract
    needs:
      - verify
      - database
      - release-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      OALO_ENVIRONMENT: preview
      OALO_PROVIDER_MODE: stub
      OALO_SYNTHETIC_DATA_ONLY: "true"
      OALO_TRIGGER_ENVIRONMENT: preview
      OALO_SUPABASE_MODE: ephemeral-preview
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the stub-only preview smoke suite
        run: pnpm test:e2e:preview

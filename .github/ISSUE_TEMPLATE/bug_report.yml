name: Bug report
description: Something broken in Open House Boost / Operation Automated LO
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for reproducible defects. Do not paste secrets, tokens, PII, or live customer spend.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the failure.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps from a clean starting point.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: local / preview / staging / production (traffic remains disabled)
      placeholder: local
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, screenshots, or failing test names. Redact secrets.
    validations:
      required: false

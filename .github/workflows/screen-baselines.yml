name: Screen baselines

# PRD-006d D8. Regenerates every screen baseline on the platform that compares them, the
# ubuntu-24.04 runner, and hands the pictures back as two artifacts. Nothing here commits: a
# person downloads the artifacts into tests/visual/screens/, reads the diff of every picture that
# changed against the rubric, and commits them with the "Baseline change:" line the pull request
# template asks for (006D-AC-013). tests/visual/screens/README.md has the exact commands.
#
# Runs on demand, and once on a push to a non-main branch that changes this file, so a branch that
# introduces the workflow can regenerate before the file exists on main.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/screen-baselines.yml

permissions:
  contents: read

concurrency:
  group: screen-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Synthetic screens (chromium project)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OALO_UPDATE_SCREEN_BASELINES: all
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Draw every synthetic screen
        run: pnpm test:browser --update-snapshots=all

      # Wave 7m. The pictures are handed back whether or not the drawing step passed. A run that
      # drew eighty screens and failed on the eighty-first used to throw all eighty away, so the
      # only way to see any of them was to fix the failure first and run the job again.
      - name: Hand back the pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-baselines-chromium
          path: tests/visual/screens/chromium/*.png
          if-no-files-found: error
          retention-days: 7

  review:
    name: Account screens and guided setup (review project)
    runs-on: ubuntu-24.04
    # The review suite is 11 to 12 minutes on a quiet runner and up to 23 when the Docker host is
    # contended, and PRD-006d's named-state review added five guided-setup steps and four
    # campaign-detail and sign-up states to it; 75 leaves room for the slow case instead of
    # cancelling a run that was going to pass.
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SUPABASE_TELEMETRY_DISABLED: "true"
      OALO_UPDATE_SCREEN_BASELINES: all
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable Corepack and confirm pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The review project only exists inside the database gate, which starts the disposable
      # database, seeds the people, and runs the TLS terminator. The write mode above makes its
      # screenshot step draw instead of compare; every other step of the gate still has to pass.
      - name: Draw every account screen and guided-setup step
        run: pnpm test:db

      # Wave 7m, as above: eighty-one review screens survive a single failed test.
      - name: Hand back the pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-baselines-review
          path: tests/visual/screens/review/*.png
          if-no-files-found: error
          retention-days: 7

      # Wave 7m. Playwright keeps a trace for every failed test (`playwright.config.ts`,
      # `trace: "retain-on-failure"`), and until now those traces died with the runner. The
      # 2026-09-20 flake was diagnosed from a trace taken on a workstation because the runner's
      # three were unreachable. This is the cheap way to never be in that position again.
      - name: Hand back the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-failure-traces
          path: test-results/browser
          if-no-files-found: ignore
          retention-days: 7
